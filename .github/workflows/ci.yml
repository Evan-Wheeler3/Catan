name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Typecheck engine + app
        run: npm run typecheck
      - name: Offline bot game
        run: npm run simulate -- --seed 42
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Edge Functions
        run: npm run sync-engine && deno check supabase/functions/*/index.ts supabase/functions/dev-server.ts
