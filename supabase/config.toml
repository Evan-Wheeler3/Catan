# Minimal local config. Run `supabase init` to regenerate a full file if you prefer.
project_id = "tideholm"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[studio]
port = 54323

[auth]
site_url = "tideholm://"
additional_redirect_urls = ["tideholm://auth-callback", "exp://127.0.0.1:8081"]

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[functions.game-tick]
verify_jwt = false
